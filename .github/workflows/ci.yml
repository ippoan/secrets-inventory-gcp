name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  packages: write   # build-image で GHCR push に必要

jobs:
  # `ippoan/ci-workflows/.github/workflows/go-ci.yml` の 3 job (vet / test /
  # build) を `ci` job id 配下に呼び出す。status check 名は caller job id
  # + ' / ' + reusable job name で:
  #   - ci / vet
  #   - ci / test
  #   - ci / build
  # auth-worker の `ippoan-go-default` branch protection preset とピン留め
  # されているので、preset 側 unit test と本 job 構成は対の契約として扱う。
  ci:
    if: github.event.pull_request.draft != true
    uses: ippoan/ci-workflows/.github/workflows/go-ci.yml@main
    permissions:
      contents: read
      id-token: write   # nested `secret-verify` job が WIF OIDC token を mint するため
    with:
      # GCP Secret Manager verify を **ci の直列後段** に組み込む。go-ci.yml
      # 側 (ci-workflows#38) で `secret-verify` job が `needs: [vet, test,
      # build]` で動き、status check は `ci / secret-verify` に出る。
      # vars 未設定の間は go-ci の `if:` で skip される (= 既存挙動互換)。
      # 検証 SA は staging deploy と同じ WIF SA を流用し、`secretmanager.viewer`
      # role を 1 個追加するだけで動く。
      gcp_secret_verify_project: cloudsql-sv
      gcp_secret_verify_provider: ${{ vars.GCP_WIF_PROVIDER }}
      gcp_secret_verify_sa: ${{ vars.GCP_WIF_SERVICE_ACCOUNT_STAGING }}
      # verify pass 後に `used-by-ippoan-secrets-inventory-gcp=active|removed`
      # label を GCP Secret Manager の宣言 secret に打つ。撤退時は `removed`
      # に flip して audit trail を残す。ci-workflows#39 で追加された opt-in。
      # `staging-deploy@cloudsql-sv` には custom role `secretsInventoryLabeler`
      # (`secretmanager.secrets.update` + `.get`) を grant 済み。Refs #17.
      gcp_secret_verify_apply_labels: true

  # GHCR への image push。non-draft PR と main push、v* tag push で走る。
  # ippoan の Cloud Run deploy 標準パターン (ci-workflows/cloud-run-
  # deploy.yml の comment 参照) は GHCR → AR remote-repo の pull-through
  # cache 経由で digest pin deploy するため、ここで GHCR に上げておく。
  # image tag は github.sha (short) で固定 — deploy 側で digest を解決する
  # ので tag のスタブ性は問題にならない。
  build-image:
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
      (github.event_name == 'pull_request' && github.event.pull_request.draft != true)
    needs: [ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/ippoan/secrets-inventory-gcp:${{ steps.meta.outputs.tag }}
            ghcr.io/ippoan/secrets-inventory-gcp:latest

  # staging deploy: ci-workflows の cloud-run-deploy.yml reusable を呼ぶ。
  # AR remote-repo `cloudsql-sv/ghcr` (daiun-salary 等と共有、既存) 経由で
  # digest pin した image を Cloud Run staging service に流す。
  #
  # Auth: issue ippoan/secrets-inventory#3 に沿って WIF (Workload Identity
  # Federation + GitHub OIDC trust)。reusable に workload_identity_provider
  # + service_account を渡し、`GCP_SA_KEY` secret は使わない。
  # **システム全体で GCP key 0 個**状態を維持 (runtime + deploy 両方)。
  #
  # env / secret / runtime SA も reusable 経由で declarative に渡す (drift
  # 防止)。`main.go` が `mustEnv("GCP_PROJECT_ID")` /
  # `mustEnv("INVENTORY_API_KEY")` を要求し、その secret に accessor を
  # 持つのは `secrets-inventory-viewer@cloudsql-sv` のみなので、runtime SA
  # もそこに enforce する (default compute SA に drift したら次の deploy で
  # 自動修正)。
  #
  # Cloud Run service `secrets-inventory-gcp-staging` は **既存前提** で、
  # reusable は services update を叩く。初回 service 作成は user 手動で
  # 1 回だけ作っておく (CLAUDE.md 参照)。作成時の SA / env / secret は何で
  # も OK — 本 reusable が毎回 `--service-account` / `--set-env-vars` /
  # `--update-secrets` で上書きする。
  #
  # GCP setup 未完了の間は vars が空で skip され、PR の必須 check は
  # `ci / *` の 3 つだけで通る。
  deploy-staging:
    if: |
      vars.GCP_PROJECT_ID_STAGING != '' &&
      vars.GCP_WIF_PROVIDER != '' &&
      vars.GCP_WIF_SERVICE_ACCOUNT_STAGING != '' && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'pull_request' && github.event.pull_request.draft != true)
      )
    needs: [ci, build-image]
    permissions:
      contents: read
      packages: read
      id-token: write   # WIF OIDC token mint 用
    uses: ippoan/ci-workflows/.github/workflows/cloud-run-deploy.yml@main
    with:
      service: secrets-inventory-gcp-staging
      region: ${{ vars.GCP_REGION }}
      project: ${{ vars.GCP_PROJECT_ID_STAGING }}
      ghcr_image: ghcr.io/ippoan/secrets-inventory-gcp
      image_tag: ${{ needs.build-image.outputs.image_tag }}
      ar_repo: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID_STAGING }}/ghcr/ippoan/secrets-inventory-gcp
      workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
      service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT_STAGING }}
      runtime_service_account: secrets-inventory-viewer@cloudsql-sv.iam.gserviceaccount.com
      set_env_vars: GCP_PROJECT_ID=${{ vars.GCP_PROJECT_ID_STAGING }}
      update_secrets: INVENTORY_API_KEY=SECRETS_INVENTORY_GCP_PROXY_API_KEY_STAGING:latest

  # production は v* タグでのみ deploy。staging と同じ WIF provider を使い、
  # SA だけ prod 用 (`vars.GCP_WIF_SERVICE_ACCOUNT`) に切り替える。
  # secret 名も prod 版: `SECRETS_INVENTORY_GCP_PROXY_API_KEY` (suffix なし)。
  # runtime SA は staging と共通の `secrets-inventory-viewer@cloudsql-sv`
  # (CLAUDE.md で 「staging と prod で同じ viewer SA」 方針)。
  deploy-production:
    if: |
      vars.GCP_PROJECT_ID != '' &&
      vars.GCP_WIF_PROVIDER != '' &&
      vars.GCP_WIF_SERVICE_ACCOUNT != '' &&
      startsWith(github.ref, 'refs/tags/v')
    needs: [ci, build-image]
    permissions:
      contents: read
      packages: read
      id-token: write
    uses: ippoan/ci-workflows/.github/workflows/cloud-run-deploy.yml@main
    with:
      service: secrets-inventory-gcp
      region: ${{ vars.GCP_REGION }}
      project: ${{ vars.GCP_PROJECT_ID }}
      ghcr_image: ghcr.io/ippoan/secrets-inventory-gcp
      image_tag: ${{ needs.build-image.outputs.image_tag }}
      ar_repo: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/ghcr/ippoan/secrets-inventory-gcp
      workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
      service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}
      runtime_service_account: secrets-inventory-viewer@cloudsql-sv.iam.gserviceaccount.com
      set_env_vars: GCP_PROJECT_ID=${{ vars.GCP_PROJECT_ID }}
      update_secrets: INVENTORY_API_KEY=SECRETS_INVENTORY_GCP_PROXY_API_KEY:latest
