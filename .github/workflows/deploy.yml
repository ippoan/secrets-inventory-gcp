name: deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  test:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test ./...
      - run: go build -o /tmp/server .

  deploy-staging:
    # 親 repo (secrets-inventory) と揃えて staging を実運用環境にする。
    # main push と非 draft PR の両方で同じ staging service に deploy する。
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.draft != true)
    needs: [test]
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: 'google-github-actions/setup-gcloud@v2'
      - name: Deploy to Cloud Run (staging)
        run: |
          gcloud run deploy "${SERVICE}" \
            --project "${PROJECT}" \
            --region "${REGION}" \
            --source . \
            --service-account "${RUNTIME_SA}" \
            --allow-unauthenticated \
            --ingress all \
            --set-env-vars "GCP_PROJECT_ID=${PROJECT}" \
            --update-secrets "INVENTORY_API_KEY=${API_KEY_SECRET}:latest" \
            --quiet
        env:
          SERVICE: secrets-inventory-gcp-staging
          PROJECT: ${{ vars.GCP_PROJECT_ID_STAGING }}
          REGION: ${{ vars.GCP_REGION }}
          RUNTIME_SA: ${{ vars.GCP_RUNTIME_SA_STAGING }}
          API_KEY_SECRET: ${{ vars.GCP_API_KEY_SECRET_STAGING }}

  deploy-production:
    # production は v* タグでのみ deploy。当面は予約のみで未稼働の想定。
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: 'google-github-actions/setup-gcloud@v2'
      - name: Deploy to Cloud Run (production)
        run: |
          gcloud run deploy "${SERVICE}" \
            --project "${PROJECT}" \
            --region "${REGION}" \
            --source . \
            --service-account "${RUNTIME_SA}" \
            --allow-unauthenticated \
            --ingress all \
            --set-env-vars "GCP_PROJECT_ID=${PROJECT}" \
            --update-secrets "INVENTORY_API_KEY=${API_KEY_SECRET}:latest" \
            --quiet
        env:
          SERVICE: secrets-inventory-gcp
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          RUNTIME_SA: ${{ vars.GCP_RUNTIME_SA }}
          API_KEY_SECRET: ${{ vars.GCP_API_KEY_SECRET }}
