name: Verify GCP Secrets

# Cloud Run runtime が要求する GCP Secret Manager 上の secret が、deploy
# 前に **実際に GCP に存在する** ことを CI で検証する caller workflow。
#
# 検証 source は本 repo の `.github/workflows/ci.yml` の cloud-run-deploy.yml
# 呼び出し `with.update_secrets:` 文字列。staging / production 両 job 分の
# `INVENTORY_API_KEY=SECRETS_INVENTORY_GCP_PROXY_API_KEY[_STAGING]:latest`
# が `secret-verify-gcp.yml` の cloud-run extraction path で抽出され、
# `cloudsql-sv` project の `gcloud secrets list` と突き合わせされる。
#
# 検証 SA `vars.GCP_WIF_SERVICE_ACCOUNT_VERIFIER` が空のとき (= GCP IAM
# セットアップ未完了) は job 全体を skip して、PR の required check は
# 既存の `ci / *` だけで通る。Setup 完了後に variable を入れた瞬間に
# verify が走り始める。deploy job の skip pattern と一貫。
#
# Refs #9.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write   # WIF OIDC token mint 用

jobs:
  verify:
    if: |
      vars.GCP_WIF_PROVIDER != '' &&
      vars.GCP_WIF_SERVICE_ACCOUNT_VERIFIER != ''
    uses: ippoan/ci-workflows/.github/workflows/secret-verify-gcp.yml@main
    with:
      project: cloudsql-sv
      repo_type: cloud-run
      workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
      service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT_VERIFIER }}
