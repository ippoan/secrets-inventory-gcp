name: Verify GCP Secrets

# Cloud Run runtime が要求する GCP Secret Manager 上の secret が、deploy
# 前に **実際に GCP に存在する** ことを CI で検証する caller workflow。
#
# 検証 source は本 repo の `.github/workflows/ci.yml` の cloud-run-deploy.yml
# 呼び出し `with.update_secrets:` 文字列。staging / production 両 job 分の
# `INVENTORY_API_KEY=SECRETS_INVENTORY_GCP_PROXY_API_KEY[_STAGING]:latest`
# が `secret-verify-gcp.yml` の cloud-run extraction path で抽出され、
# `cloudsql-sv` project の `gcloud secrets list` と突き合わせされる。
#
# Auth は既存の deploy SA (`cloud-run-deployer-staging@cloudsql-sv`,
# `vars.GCP_WIF_SERVICE_ACCOUNT_STAGING`) を **そのまま流用** する。WIF
# binding (`secrets-inventory-gcp` repo → 同 SA) は既に CLAUDE.md 手順で
# 構築済みなので、verify 用に追加で必要なのは:
#
#   gcloud projects add-iam-policy-binding cloudsql-sv \
#     --member=serviceAccount:cloud-run-deployer-staging@cloudsql-sv.iam.gserviceaccount.com \
#     --role=roles/secretmanager.viewer
#
# の 1 コマンドで `secretmanager.secrets.list` を許可するだけ (verify 専用
# SA は作らない = 最小コスト路線、issue #9 の "GCP IAM 設計" 推奨どおり)。
#
# `vars.GCP_WIF_SERVICE_ACCOUNT_STAGING` が未設定の間は deploy 同様 job
# 全体を skip。Setup 完了後 variable を入れた瞬間に verify が走り始める。
#
# Refs #9.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write   # WIF OIDC token mint 用

jobs:
  verify:
    if: |
      vars.GCP_WIF_PROVIDER != '' &&
      vars.GCP_WIF_SERVICE_ACCOUNT_STAGING != ''
    uses: ippoan/ci-workflows/.github/workflows/secret-verify-gcp.yml@main
    with:
      project: cloudsql-sv
      repo_type: cloud-run
      workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
      service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT_STAGING }}
